<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <img src="logo.png" alt="AKANS Logo">
      <h2>Admin Panel</h2>
    </div>

    <p class="login-error" id="adminError"></p>

    <button type="button" class="google-btn" id="adminGoogleBtn">
      <svg viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.4 0-13.8 4.2-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.7 2.5-7.7 2.5-5.2 0-9.6-3.5-11.2-8.2l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.5 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>

    <p class="admin-note">🔒 Sirf authorized admin account hi is panel ko access kar sakta hai.</p>

  </div>
</div>

<script type="module">
  import { loginWithGoogle, logout, watchAuthState } from './js/auth.js';

  const ADMIN_EMAIL = 'akans47g@gmail.com';

  document.getElementById('adminGoogleBtn').addEventListener('click', async function(){
    const errEl = document.getElementById('adminError');
    errEl.textContent = '';
    try{
      const user = await loginWithGoogle();
      if (user.email !== ADMIN_EMAIL){
        await logout();
        errEl.textContent = '⛔ Ye Google account admin panel access nahi kar sakta';
        return;
      }
      window.location.href = 'admin/dashboard.html';
    } catch(err){
      errEl.textContent = 'Login fail ho gaya, dobara try karein';
    }
  });

  // Pehle se admin ke roop me logged in hai to seedha dashboard bhej do
  watchAuthState(function(user){
    if (user && user.email === ADMIN_EMAIL){
      window.location.href = 'admin/dashboard.html';
    }
  });
</script>

</body>
</html>
