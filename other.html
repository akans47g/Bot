<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Other | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* =================================================================
   AKANS STORE — MAIN STYLESHEET (style.css)
================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#181428;
  --sub:#6E6B85;
  --brand:#4F2FCE;
  --brand-2:#7B4FF0;
  --accent:#FF6B3D;
  --accent-2:#FFA751;
  --success:#16C784;
  --bg:#F6F4FC;
  --surface:#FFFFFF;
  --line:#ECEAF5;
  --radius:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}

h1,h2,h3,h4{
  font-family:'Baloo 2','Inter',sans-serif;
  margin:0 0 4px;
  color:var(--ink);
}
a{ color:inherit; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; }

.page-wrap{
  max-width:480px;
  margin:0 auto;
  padding:16px 16px 4px;
}

/* ---------------- HEADER ---------------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  margin:6px 0 20px;
}
.header-text{ flex:1; }
.header-text h3{
  font-size:17px;
  font-weight:800;
  color:var(--brand);
  margin-bottom:2px;
}
.header-tag{
  font-size:11px;
  color:var(--sub);
  font-weight:600;
  margin:0;
}
.header img{
  height:42px;
  width:42px;
  border-radius:12px;
  object-fit:cover;
  background:var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  flex-shrink:0;
}

/* ---------------- COMING SOON ---------------- */
.coming-soon-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 20px 40px;
}
.coming-soon-icon{
  width:88px; height:88px; border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:flex; align-items:center; justify-content:center;
  font-size:38px;
  margin-bottom:22px;
  box-shadow:0 10px 26px rgba(79,47,206,.3);
  animation:comingPulse 2.4s ease-in-out infinite;
}
@keyframes comingPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
}
.coming-soon-wrap h2{ font-size:24px; font-weight:800; margin-bottom:8px; }
.coming-soon-wrap p{ font-size:13.5px; color:var(--sub); max-width:300px; margin:0 auto 22px; }
.coming-soon-badge{
  display:inline-block;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:7px 18px;
  border-radius:20px;
  box-shadow:0 6px 16px rgba(255,107,61,.3);
}

/* ---------------- BOTTOM NAV ---------------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  display:flex;
  justify-content:space-around;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 0 max(8px, env(safe-area-inset-bottom));
  z-index:500;
  transition:transform .25s ease;
}
.bottom-nav.hide{ transform:translateY(100%); }
.nav-item{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  color:var(--sub);
  font-size:10.5px;
  font-weight:600;
  padding:4px 10px;
  cursor:pointer;
}
.nav-item::before{ font-size:19px; }
.nav-item[data-page="index.html"]::before{ content:"🏠"; }
.nav-item[data-page="ff.html"]::before{ content:"🎮"; }
.nav-item[data-page="other.html"]::before{ content:"🗂️"; }
.nav-item[data-page="account.html"]::before{ content:"👤"; }
.nav-item.active{ color:var(--accent); }

@media (prefers-reduced-motion: reduce){
  .bottom-nav{ transition:none; }
  .coming-soon-icon{ animation:none; }
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F2FCE">
<script src="js/pwa-install.js"></script>
</head>
<body>

<div class="page-wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-text">
      <h3>AKANS Social Store</h3>
      <p class="header-tag">Bundles • Deals • Fast Delivery</p>
    </div>
    <img src="image/logo.png" alt="AKANS Logo">
  </div>

  <!-- COMING SOON -->
  <div class="coming-soon-wrap">
    <div class="coming-soon-icon">🚀</div>
    <h2>Coming Soon</h2>
    <p>Hum kuch naya aur exciting laane wale hain is section mein. Jald hi update milega!</p>
    <span class="coming-soon-badge">🔔 Stay Tuned</span>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item" data-page="index.html" onclick="location.href='index.html'">
    <span>Bundles</span>
  </button>
  <button class="nav-item" data-page="ff.html" onclick="location.href='ff.html'">
    <span>Free Fire</span>
  </button>
  <button class="nav-item" data-page="other.html" onclick="location.href='other.html'">
    <span>Other</span>
  </button>
  <button class="nav-item" data-page="account.html" onclick="location.href='account.html'">
    <span>Account</span>
  </button>
</nav>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".nav-item").forEach(btn => {
    if (btn.dataset.page === currentPage) btn.classList.add("active");
  });

  let lastScroll = 0;
  const nav = document.querySelector(".bottom-nav");
  if (nav) {
    window.addEventListener("scroll", () => {
      const cur = window.pageYOffset;
      nav.classList.toggle("hide", cur > lastScroll && cur > 80);
      lastScroll = cur;
    });
  }
});
</script>

<script>
// ---- Mechanical keyboard style click sound (synthesized, no audio file needed) ----
(function(){
  let clickCtx = null;
  function getCtx(){
    if (!clickCtx) clickCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (clickCtx.state === 'suspended') clickCtx.resume();
    return clickCtx;
  }
  function playMechClick(){
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      const bufferSize = Math.floor(ctx.sampleRate * 0.03);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 3200;
      bandpass.Q.value = 1.1;
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.32, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      noise.connect(bandpass);
      bandpass.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.05);
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(350, now + 0.02);
      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.1, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.03);
    } catch (e) {}
  }
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if (btn) playMechClick();
  });
})();
</script>
</body>
</html>
