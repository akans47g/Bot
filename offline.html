<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F6F4FC; color:#181428;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding:24px;
  }
  .offline-card{
    text-align:center; max-width:340px;
    background:#FFFFFF; border:1px solid #ECEAF5; border-radius:22px;
    padding:36px 24px; box-shadow:0 10px 30px rgba(79,47,206,.08);
  }
  .offline-icon{ font-size:44px; margin-bottom:14px; }
  h2{ font-size:19px; font-weight:800; margin:0 0 8px; }
  p{ font-size:13.5px; color:#6E6B85; line-height:1.6; margin:0 0 20px; }
  button{
    border:none; cursor:pointer; font-family:inherit;
    background:linear-gradient(135deg,#4F2FCE,#7B4FF0);
    color:#fff; font-size:14px; font-weight:800;
    padding:12px 28px; border-radius:14px;
  }
  button:active{ transform:scale(.97); }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h2>You're Offline</h2>
    <p>Please check your internet connection. Your wallet and orders are always kept safe on our servers — nothing is lost.</p>
    <button onclick="location.reload()">🔄 Retry</button>
  </div>
</body>
</html>
