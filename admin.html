<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* =================================================================
   AKANS STORE — MAIN STYLESHEET (style.css)
   =================================================================
   Poori site ki styling yahan hai: header, bundle cards, details
   box, trending scroll, support/social cards, trust footer, aur
   bottom nav.

   👉 buy-modal.css alag file hai, usse yahan kuch chhua nahi gaya.
   👉 Rang badalne ho to bas neeche ":root" wale variables edit karo
      — pura site automatically update ho jaayega.
================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#181428;      /* main text */
  --sub:#6E6B85;       /* muted/secondary text */
  --brand:#4F2FCE;     /* primary brand (headings, badges, nav) */
  --brand-2:#7B4FF0;   /* brand gradient partner */
  --accent:#FF6B3D;    /* CTA orange — same as buy-modal.css */
  --accent-2:#FFA751;  /* CTA orange gradient partner */
  --success:#16C784;   /* trust / positive */
  --bg:#F6F4FC;        /* page background */
  --surface:#FFFFFF;   /* card background */
  --line:#ECEAF5;      /* borders / dividers */
  --radius:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px; /* room for fixed bottom nav */
}

h1,h2,h3,h4{
  font-family:'Baloo 2','Inter',sans-serif;
  margin:0 0 4px;
  color:var(--ink);
}
a{ color:inherit; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; }

.page-wrap{
  max-width:480px;
  margin:0 auto;
  padding:16px 16px 4px;
}

/* ---------------- HEADER ---------------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  margin:6px 0 20px;
}
.header-text h3{
  font-size:17px;
  font-weight:800;
  color:var(--brand);
  margin-bottom:2px;
}
.header-tag{
  font-size:11px;
  color:var(--sub);
  font-weight:600;
  margin:0;
}
.header img{
  height:42px;
  width:42px;
  border-radius:12px;
  object-fit:cover;
  background:var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  flex-shrink:0;
}

/* ---------------- SECTION TITLE ---------------- */
.section-title{
  text-align:center;
  margin:6px 0 20px;
}
.section-badge{
  display:inline-block;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:5px 14px;
  border-radius:20px;
  margin-bottom:8px;
}
.section-title h2{ font-size:22px; font-weight:800; }
.section-title p{ color:var(--sub); font-size:13px; margin:4px 0 0; }

/* ---------------- BUNDLE CARD ---------------- */
.bundle-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(79,47,206,.06);
}
.card-top{ display:flex; gap:12px; }
.card-img{
  width:84px; height:84px;
  border-radius:14px;
  object-fit:cover;
  background:var(--line);
  flex-shrink:0;
}
.card-text{ flex:1; min-width:0; }

.card-badge{
  display:inline-block;
  background:var(--bg);
  color:var(--brand);
  border:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  padding:3px 9px;
  border-radius:20px;
  margin-bottom:6px;
}
.card-badge.popular-badge{ background:#FFF7E0; border-color:#FFE7A3; color:#B8860B; }
.card-badge.hot-badge{ background:#FFEDE8; border-color:#FFCFC0; color:var(--accent); }

.card-text h3{ font-size:15.5px; font-weight:700; line-height:1.25; margin-bottom:4px; }
.card-count{ font-size:12px; color:var(--sub); margin:0 0 8px; }

.price-row{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#FFF3EC;
  border:1px dashed #FFCBA8;
  border-radius:10px;
  padding:4px 10px;
  margin-bottom:6px;
}
.price-row del{ color:var(--sub); font-size:12.5px; font-weight:500; }
.price-row .price-now{ color:var(--accent); font-size:17px; font-weight:800; }

.urgent{
  font-size:11.5px;
  font-weight:700;
  color:var(--accent);
  margin:0 0 10px;
  animation:urgentPulse 2.2s ease-in-out infinite;
}

.btn-row{ display:flex; gap:8px; }
.details-btn{
  flex:1;
  background:var(--surface);
  border:1.5px solid var(--line);
  color:var(--sub);
  font-size:12.5px;
  font-weight:700;
  padding:9px 6px;
  border-radius:12px;
  cursor:pointer;
}
.buy-btn, .t-buy-btn{
  flex:1;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none;
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  padding:9px 6px;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(255,107,61,.3);
}
.details-btn:active, .buy-btn:active, .t-buy-btn:active{ transform:scale(.97); }

/* ---------------- DETAILS BOX ---------------- */
.details-box{
  display:none;
  margin-top:10px;
  padding-top:12px;
  border-top:1px dashed var(--line);
}
.details-grid{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:7px 10px;
  font-size:12px;
}
.details-grid span:nth-child(odd){ color:var(--sub); font-weight:600; white-space:nowrap; }
.details-grid span:nth-child(even){ color:var(--ink); font-weight:500; }

/* ---------------- TRENDING SCROLL ---------------- */
.trending-scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 16px 18px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.trending-scroll::-webkit-scrollbar{ display:none; }
.trending-card{
  flex:0 0 132px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  scroll-snap-align:start;
  box-shadow:0 2px 10px rgba(79,47,206,.06);
}
.trending-card img{
  width:100%; height:90px;
  border-radius:10px;
  object-fit:cover;
  background:var(--line);
  margin-bottom:8px;
}
.trending-card h4{ font-size:12.5px; font-weight:700; margin-bottom:2px; line-height:1.25; }
.trending-card p{ font-size:11px; color:var(--sub); margin:0 0 6px; }
.t-price{ color:var(--accent) !important; font-weight:800 !important; font-size:13px !important; }

/* ---------------- SUPPORT / SOCIAL / INFO CARDS ---------------- */
.info-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
}
.support-card{ text-align:center; }
.info-icon{ font-size:28px; margin-bottom:6px; }
.support-card h3{ font-size:15px; }
.support-card p{ color:var(--sub); font-size:12.5px; margin:2px 0 10px; }
.support-email{
  display:inline-block;
  background:var(--bg);
  color:var(--brand);
  font-weight:700;
  font-size:13px;
  padding:8px 16px;
  border-radius:20px;
  text-decoration:none;
}

.proof-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.proof-row:last-child{ border-bottom:none; }
.proof-label{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
.proof-icon{
  width:32px; height:32px;
  border-radius:50%;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
}
.blue-btn{
  background:var(--brand);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:7px 16px;
  border-radius:20px;
  text-decoration:none;
}

/* ---------------- TRUST FOOTER ---------------- */
.trust-card{
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:20px;
  text-align:center;
}
.trust-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.trust-item{ font-size:11.5px; font-weight:700; color:var(--ink); }
.trust-note{ font-size:11px; color:var(--sub); font-style:italic; margin:0; }

/* ---------------- BOTTOM NAV ---------------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  display:flex;
  justify-content:space-around;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 0 max(8px, env(safe-area-inset-bottom));
  z-index:500;
  transition:transform .25s ease;
}
.bottom-nav.hide{ transform:translateY(100%); }
.nav-item{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  color:var(--sub);
  font-size:10.5px;
  font-weight:600;
  padding:4px 10px;
  cursor:pointer;
}
.nav-item::before{ font-size:19px; }
.nav-item[data-page="index.html"]::before{ content:"🏠"; }
.nav-item[data-page="ff.html"]::before{ content:"🎮"; }
.nav-item[data-page="other.html"]::before{ content:"🗂️"; }
.nav-item[data-page="dashboard.html"]::before{ content:"📊"; }
.nav-item[data-page="topups.html"]::before{ content:"💰"; }
.nav-item[data-page="orders.html"]::before{ content:"📦"; }
.nav-item[data-page="bundles.html"]::before{ content:"🎁"; }
.nav-item[data-page="analytics.html"]::before{ content:"📈"; }
.nav-item[data-page="users.html"]::before{ content:"👥"; }
.nav-item[data-page="withdrawals.html"]::before{ content:"💸"; }
.nav-item[data-page="ff-orders.html"]::before{ content:"🎮"; }
.nav-item[data-page="account.html"]::before{ content:"👤"; }
.nav-item.active{ color:var(--accent); }

/* ---------------- MOTION & ACCESSIBILITY ---------------- */
@keyframes urgentPulse{
  0%,100%{ opacity:1; }
  50%{ opacity:.55; }
}
.details-btn:focus-visible,
.buy-btn:focus-visible,
.t-buy-btn:focus-visible,
.blue-btn:focus-visible,
.support-email:focus-visible,
.nav-item:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  .urgent{ animation:none; }
  .bottom-nav{ transition:none; }
}
</style>
<style>
/* =================================================================
   LOGIN.CSS — Login / Sign Up page
   (style.css ke variables/fonts use karta hai — isliye login.html
   me style.css ISSE PEHLE link hona chahiye)
================================================================= */

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.login-card{
  width:100%;
  max-width:380px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:28px 24px;
  box-shadow:0 10px 30px rgba(79,47,206,.08);
}

.login-brand{ text-align:center; margin-bottom:22px; }
.login-brand img{
  width:52px; height:52px;
  border-radius:14px;
  object-fit:cover;
  background:var(--bg);
  margin:0 auto 10px;
}
.login-brand h2{ font-size:19px; font-weight:800; color:var(--brand); }

.login-tabs{
  display:flex;
  background:var(--bg);
  border-radius:14px;
  padding:4px;
  margin-bottom:18px;
}
.login-tab{
  flex:1;
  border:none;
  background:none;
  padding:9px 0;
  border-radius:10px;
  font-size:13.5px;
  font-weight:700;
  color:var(--sub);
  cursor:pointer;
  font-family:inherit;
}
.login-tab.active{
  background:var(--surface);
  color:var(--brand);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.login-error{
  min-height:16px;
  font-size:12.5px;
  font-weight:600;
  color:var(--accent);
  text-align:center;
  margin:0 0 10px;
}

.login-input{
  width:100%;
  box-sizing:border-box;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:13px 14px;
  font-size:14px;
  font-family:inherit;
  margin-bottom:10px;
}
.login-input:focus{ outline:none; border-color:var(--brand); }

.login-forgot{
  display:block;
  border:none;
  background:none;
  color:var(--brand);
  font-size:12px;
  font-weight:700;
  padding:0 0 14px;
  cursor:pointer;
  margin-left:auto;
  font-family:inherit;
}

.login-primary-btn{
  width:100%;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-size:15px;
  font-weight:800;
  padding:14px;
  border-radius:14px;
  font-family:inherit;
  box-shadow:0 8px 20px rgba(255,107,61,.3);
}
.login-primary-btn:active{ transform:scale(.98); }

.login-or{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:var(--sub);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}
.login-or::before, .login-or::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}

.google-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  font-family:inherit;
}
.google-btn:active{ transform:scale(.98); }
.google-btn svg{ width:18px; height:18px; flex-shrink:0; }

.admin-note{
  text-align:center;
  font-size:11.5px;
  color:var(--sub);
  margin-top:16px;
  line-height:1.5;
}

.referral-banner{
  display:none;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:var(--success);
  background:#E8F9F1;
  border-radius:10px;
  padding:9px 10px;
  margin-bottom:14px;
}
.referral-banner.show{ display:block; }

.login-primary-btn:focus-visible,
.google-btn:focus-visible,
.login-tab:focus-visible,
.login-forgot:focus-visible,
.login-input:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:2px;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <img src="logo.png" alt="AKANS Logo">
      <h2>Admin Panel</h2>
    </div>

    <p class="login-error" id="adminError"></p>

    <button type="button" class="google-btn" id="adminGoogleBtn">
      <svg viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.4 0-13.8 4.2-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.7 2.5-7.7 2.5-5.2 0-9.6-3.5-11.2-8.2l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.5 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>

    <p class="admin-note">🔒 Sirf authorized admin account hi is panel ko access kar sakta hai.</p>

  </div>
</div>

<script type="module">
  import { loginWithGoogle, logout, watchAuthState } from './js/auth.js';

  const ADMIN_EMAIL = 'akans47g@gmail.com';

  document.getElementById('adminGoogleBtn').addEventListener('click', async function(){
    const errEl = document.getElementById('adminError');
    errEl.textContent = '';
    try{
      const user = await loginWithGoogle();
      if (user.email !== ADMIN_EMAIL){
        await logout();
        errEl.textContent = '⛔ Ye Google account admin panel access nahi kar sakta';
        return;
      }
      window.location.href = 'admin/dashboard.html';
    } catch(err){
      errEl.textContent = 'Login fail ho gaya, dobara try karein';
    }
  });

  // Pehle se admin ke roop me logged in hai to seedha dashboard bhej do
  watchAuthState(function(user){
    if (user && user.email === ADMIN_EMAIL){
      window.location.href = 'admin/dashboard.html';
    }
  });
</script>

</body>
</html>
