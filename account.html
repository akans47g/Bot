<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* =================================================================
   AKANS STORE — MAIN STYLESHEET (style.css)
   =================================================================
   Poori site ki styling yahan hai: header, bundle cards, details
   box, trending scroll, support/social cards, trust footer, aur
   bottom nav.

   👉 buy-modal.css alag file hai, usse yahan kuch chhua nahi gaya.
   👉 Rang badalne ho to bas neeche ":root" wale variables edit karo
      — pura site automatically update ho jaayega.
================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#181428;      /* main text */
  --sub:#6E6B85;       /* muted/secondary text */
  --brand:#4F2FCE;     /* primary brand (headings, badges, nav) */
  --brand-2:#7B4FF0;   /* brand gradient partner */
  --accent:#FF6B3D;    /* CTA orange — same as buy-modal.css */
  --accent-2:#FFA751;  /* CTA orange gradient partner */
  --success:#16C784;   /* trust / positive */
  --bg:#F6F4FC;        /* page background */
  --surface:#FFFFFF;   /* card background */
  --line:#ECEAF5;      /* borders / dividers */
  --radius:18px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px; /* room for fixed bottom nav */
}

h1,h2,h3,h4{
  font-family:'Baloo 2','Inter',sans-serif;
  margin:0 0 4px;
  color:var(--ink);
}
a{ color:inherit; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; }

.page-wrap{
  max-width:480px;
  margin:0 auto;
  padding:16px 16px 4px;
}

/* ---------------- HEADER ---------------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  margin:6px 0 20px;
}
.header-status{
  display:flex; align-items:center; gap:6px; flex-shrink:0;
  font-size:11.5px; font-weight:700; color:var(--success);
}
.header-status .status-dot{
  width:8px; height:8px; border-radius:50%; background:var(--success);
  display:inline-block;
}
.header-text{ flex:1; text-align:center; }
.header-text h3{
  font-size:17px;
  font-weight:800;
  color:var(--brand);
  margin-bottom:2px;
}
.header-tag{
  font-size:11px;
  color:var(--sub);
  font-weight:600;
  margin:0;
}
.header img{
  height:42px;
  width:42px;
  border-radius:12px;
  object-fit:cover;
  background:var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  flex-shrink:0;
}

/* ---------------- SECTION TITLE ---------------- */
.section-title{
  text-align:center;
  margin:6px 0 20px;
}
.section-badge{
  display:inline-block;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:5px 14px;
  border-radius:20px;
  margin-bottom:8px;
}
.section-title h2{ font-size:22px; font-weight:800; }
.section-title p{ color:var(--sub); font-size:13px; margin:4px 0 0; }

/* ---------------- BUNDLE CARD ---------------- */
.bundle-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(79,47,206,.06);
}
.card-top{ display:flex; gap:12px; }
.card-img{
  width:84px; height:84px;
  border-radius:14px;
  object-fit:cover;
  background:var(--line);
  flex-shrink:0;
}
.card-text{ flex:1; min-width:0; }

.card-badge{
  display:inline-block;
  background:var(--bg);
  color:var(--brand);
  border:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  padding:3px 9px;
  border-radius:20px;
  margin-bottom:6px;
}
.card-badge.popular-badge{ background:#FFF7E0; border-color:#FFE7A3; color:#B8860B; }
.card-badge.hot-badge{ background:#FFEDE8; border-color:#FFCFC0; color:var(--accent); }

.card-text h3{ font-size:15.5px; font-weight:700; line-height:1.25; margin-bottom:4px; }
.card-count{ font-size:12px; color:var(--sub); margin:0 0 8px; }

.price-row{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#FFF3EC;
  border:1px dashed #FFCBA8;
  border-radius:10px;
  padding:4px 10px;
  margin-bottom:6px;
}
.price-row del{ color:var(--sub); font-size:12.5px; font-weight:500; }
.price-row .price-now{ color:var(--accent); font-size:17px; font-weight:800; }

.urgent{
  font-size:11.5px;
  font-weight:700;
  color:var(--accent);
  margin:0 0 10px;
  animation:urgentPulse 2.2s ease-in-out infinite;
}

.btn-row{ display:flex; gap:8px; }
.details-btn{
  flex:1;
  background:var(--surface);
  border:1.5px solid var(--line);
  color:var(--sub);
  font-size:12.5px;
  font-weight:700;
  padding:9px 6px;
  border-radius:12px;
  cursor:pointer;
}
.buy-btn, .t-buy-btn{
  flex:1;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none;
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  padding:9px 6px;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(255,107,61,.3);
}
.details-btn:active, .buy-btn:active, .t-buy-btn:active{ transform:scale(.97); }

/* ---------------- DETAILS BOX ---------------- */
.details-box{
  display:none;
  margin-top:10px;
  padding-top:12px;
  border-top:1px dashed var(--line);
}
.details-grid{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:7px 10px;
  font-size:12px;
}
.details-grid span:nth-child(odd){ color:var(--sub); font-weight:600; white-space:nowrap; }
.details-grid span:nth-child(even){ color:var(--ink); font-weight:500; }

/* ---------------- TRENDING SCROLL ---------------- */
.trending-scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 16px 18px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.trending-scroll::-webkit-scrollbar{ display:none; }
.trending-card{
  flex:0 0 132px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  scroll-snap-align:start;
  box-shadow:0 2px 10px rgba(79,47,206,.06);
}
.trending-card img{
  width:100%; height:90px;
  border-radius:10px;
  object-fit:cover;
  background:var(--line);
  margin-bottom:8px;
}
.trending-card h4{ font-size:12.5px; font-weight:700; margin-bottom:2px; line-height:1.25; }
.trending-card p{ font-size:11px; color:var(--sub); margin:0 0 6px; }
.t-price{ color:var(--accent) !important; font-weight:800 !important; font-size:13px !important; }

/* ---------------- SUPPORT / SOCIAL / INFO CARDS ---------------- */
.info-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
}
.support-card{ text-align:center; }
.info-icon{ font-size:28px; margin-bottom:6px; }
.support-card h3{ font-size:15px; }
.support-card p{ color:var(--sub); font-size:12.5px; margin:2px 0 10px; }
.support-email{
  display:inline-block;
  background:var(--bg);
  color:var(--brand);
  font-weight:700;
  font-size:13px;
  padding:8px 16px;
  border-radius:20px;
  text-decoration:none;
}

.proof-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}
.proof-row:last-child{ border-bottom:none; }
.proof-label{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
.proof-icon{
  width:32px; height:32px;
  border-radius:50%;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
}
.blue-btn{
  background:var(--brand);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:7px 16px;
  border-radius:20px;
  text-decoration:none;
}

/* ---------------- TRUST FOOTER ---------------- */
.trust-card{
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:20px;
  text-align:center;
}
.trust-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.trust-item{ font-size:11.5px; font-weight:700; color:var(--ink); }
.trust-note{ font-size:11px; color:var(--sub); font-style:italic; margin:0; }

/* ---------------- BOTTOM NAV ---------------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  display:flex;
  justify-content:space-around;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 0 max(8px, env(safe-area-inset-bottom));
  z-index:500;
  transition:transform .25s ease;
}
.bottom-nav.hide{ transform:translateY(100%); }
.nav-item{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  color:var(--sub);
  font-size:10.5px;
  font-weight:600;
  padding:4px 10px;
  cursor:pointer;
}
.nav-item::before{ font-size:19px; }
.nav-item[data-page="index.html"]::before{ content:"🏠"; }
.nav-item[data-page="ff.html"]::before{ content:"🎮"; }
.nav-item[data-page="other.html"]::before{ content:"🗂️"; }
.nav-item[data-page="dashboard.html"]::before{ content:"📊"; }
.nav-item[data-page="topups.html"]::before{ content:"💰"; }
.nav-item[data-page="orders.html"]::before{ content:"📦"; }
.nav-item[data-page="bundles.html"]::before{ content:"🎁"; }
.nav-item[data-page="analytics.html"]::before{ content:"📈"; }
.nav-item[data-page="users.html"]::before{ content:"👥"; }
.nav-item[data-page="withdrawals.html"]::before{ content:"💸"; }
.nav-item[data-page="ff-orders.html"]::before{ content:"🎮"; }
.nav-item[data-page="account.html"]::before{ content:"👤"; }
.nav-item.active{ color:var(--accent); }

/* ---------------- MOTION & ACCESSIBILITY ---------------- */
@keyframes urgentPulse{
  0%,100%{ opacity:1; }
  50%{ opacity:.55; }
}
.details-btn:focus-visible,
.buy-btn:focus-visible,
.t-buy-btn:focus-visible,
.blue-btn:focus-visible,
.support-email:focus-visible,
.nav-item:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  .urgent{ animation:none; }
  .bottom-nav{ transition:none; }
  .ac-menu-item.partner-premium{ animation:none; }
  .ac-menu-item.partner-premium::after{ animation:none; display:none; }
  .ac-menu-item.install-highlight .ac-menu-icon{ animation:none; }
}
</style>
<style>
/* =================================================================
   ACCOUNT.CSS — Account page
   (style.css ke variables/fonts use karta hai)
================================================================= */

.ac-profile-card{
  display:flex; align-items:center; gap:14px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  border-radius:var(--radius);
  padding:16px;
  margin:10px 0 16px;
  box-shadow:0 8px 22px rgba(79,47,206,.28);
}
.ac-avatar{
  width:56px; height:56px; border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.55);
  color:#fff; font-size:22px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.ac-profile-info{ flex:1; min-width:0; text-align:left; }
.ac-profile-info h3{ font-size:16px; font-weight:800; color:#fff; margin-bottom:2px; }
.ac-profile-info p{ font-size:12.5px; color:rgba(255,255,255,.82); margin:0; }
.ac-profile-whatsapp{
  display:flex; align-items:center; gap:5px;
}
.ac-profile-info p.ac-profile-whatsapp{ margin-top:4px; }
.ac-whatsapp-value{ font-weight:700; color:#fff; }
.ac-edit-btn{
  width:38px; height:38px; border-radius:12px; flex-shrink:0;
  border:none; background:rgba(255,255,255,.22);
  color:#fff; font-size:16px; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease, background .15s ease;
}
.ac-edit-btn:active{ transform:scale(.9); background:rgba(255,255,255,.32); }

.ac-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px 16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(79,47,206,.06);
}
.ac-section-label{
  font-size:11.5px; font-weight:700; letter-spacing:.03em;
  text-transform:uppercase; color:var(--sub);
  margin:10px 2px 4px;
}
.ac-balance-card{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  padding:16px;
}
.ac-label{ font-size:12px; color:var(--sub); margin-bottom:4px; }
.ac-balance{ font-size:26px; font-weight:800; color:var(--brand); }
.ac-addmoney-btn{
  border:none; border-radius:20px; padding:9px 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
}
.ac-addmoney-btn:active{ transform:scale(.97); }

.ac-menu-item{
  width:100%; display:flex; align-items:center; gap:12px;
  border:none; background:none; padding:12px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer; font-family:inherit; text-align:left;
  transition:background .15s ease, transform .1s ease;
  border-radius:10px;
}
.ac-menu-item:last-child{ border-bottom:none; }
.ac-menu-icon{
  width:40px; height:40px; border-radius:12px; flex-shrink:0;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  transition:background .15s ease;
}
.ac-menu-text{ flex:1; min-width:0; }
.ac-menu-title{ display:block; font-size:14.5px; font-weight:700; color:var(--ink); }
.ac-menu-sub{ display:block; font-size:11.5px; color:var(--sub); margin-top:1px; }
.ac-arrow{ color:var(--sub); font-size:17px; flex-shrink:0; }

/* Unique tap state — same idea as the FF cards: something visibly changes on click */
.ac-menu-item:active{
  background:var(--bg);
  transform:scale(.98);
}
.ac-menu-item:active .ac-menu-icon{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
}

/* ---------------- PARTNER PROGRAM — premium/VIP row ---------------- */
/* Gold, same tier-premium language as the bundle/FF badges elsewhere on the site */
.ac-menu-item.partner-premium{
  background:linear-gradient(135deg,#FFD97A,#FFB349);
  border-radius:14px;
  padding:14px 12px;
  margin:6px 0 2px;
  border-bottom:none;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(255,179,73,.4);
  animation:partnerGlow 2.4s ease-in-out infinite;
}
.ac-menu-item.partner-premium::after{
  content:"";
  position:absolute; top:0; left:-60%;
  width:45%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
  transform:skewX(-20deg);
  animation:partnerShine 3s ease-in-out infinite;
}
.ac-menu-item.partner-premium .ac-menu-icon{
  background:rgba(255,255,255,.4);
}
.ac-menu-item.partner-premium .ac-menu-title{ color:#5A3600; }
.ac-menu-item.partner-premium .ac-menu-sub{ color:#7A4300; }
.ac-menu-item.partner-premium .ac-arrow{ color:#7A4300; }
.ac-menu-item.partner-premium:active{
  background:linear-gradient(135deg,#FFC966,#FFA733);
  transform:scale(.97);
}
.ac-menu-item.partner-premium:active .ac-menu-icon{
  background:rgba(255,255,255,.5);
}
.partner-badge{
  display:inline-block;
  background:rgba(122,67,0,.16);
  color:#5A3600;
  font-size:9px;
  font-weight:800;
  padding:2px 7px;
  border-radius:8px;
  margin-left:6px;
  vertical-align:middle;
  letter-spacing:.02em;
}
@keyframes partnerGlow{
  0%,100%{ box-shadow:0 6px 18px rgba(255,179,73,.4); }
  50%{ box-shadow:0 6px 26px rgba(255,179,73,.68); }
}
@keyframes partnerShine{
  0%{ left:-60%; }
  45%{ left:130%; }
  100%{ left:130%; }
}

/* ---------------- INSTALL APP — distinct call-to-action row ---------------- */
.ac-menu-item.install-highlight{
  background:linear-gradient(135deg,#F3EEFF,#FFF3EC);
  border-radius:14px;
  padding:14px 12px;
  margin:6px 0 2px;
  border-bottom:none;
  box-shadow:0 4px 14px rgba(79,47,206,.12);
}
.ac-menu-item.install-highlight .ac-menu-icon{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;
  animation:installBounce 1.8s ease-in-out infinite;
}
.ac-menu-item.install-highlight .ac-menu-title{ color:var(--brand); }
.ac-menu-item.install-highlight:active{
  background:linear-gradient(135deg,#EBE3FF,#FFE9DC);
  transform:scale(.97);
}
.ac-menu-item.install-highlight:active .ac-menu-icon{
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  animation:none;
}
.install-badge{
  display:inline-block;
  background:rgba(79,47,206,.12);
  color:var(--brand);
  font-size:9px;
  font-weight:800;
  padding:2px 7px;
  border-radius:8px;
  margin-left:6px;
  vertical-align:middle;
  letter-spacing:.02em;
}
@keyframes installBounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-3px); }
}

.ac-whatsapp-value{ font-size:14.5px; font-weight:600; color:var(--ink); }

.ac-footer-note{
  text-align:center; font-size:11px; color:var(--sub);
  margin:0 0 16px;
}

.ac-logout-btn{
  width:100%; border:1.5px solid #F6C9CB; background:#FDEEEE;
  color:#E63946; font-size:14px; font-weight:700;
  padding:13px; border-radius:14px; cursor:pointer; font-family:inherit;
  margin-bottom:14px;
}
.ac-logout-btn:active{ transform:scale(.98); }

.ac-menu-item:focus-visible,
.ac-edit-btn:focus-visible,
.ac-addmoney-btn:focus-visible,
.ac-logout-btn:focus-visible{
  outline:2px solid var(--brand); outline-offset:2px;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".nav-item").forEach(btn => {
    if (btn.dataset.page === currentPage) btn.classList.add("active");
  });

  let lastScroll = 0;
  const nav = document.querySelector(".bottom-nav");
  if (nav) {
    window.addEventListener("scroll", () => {
      const cur = window.pageYOffset;
      nav.classList.toggle("hide", cur > lastScroll && cur > 80);
      lastScroll = cur;
    });
  }
});
