<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account | AKANS Social Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<div class="page-wrap">

  <div class="header">
    <div class="header-text">
      <h3>AKANS Social Store</h3>
      <p class="header-tag">Bundles • Deals • Fast Delivery</p>
    </div>
    <img src="logo.png" alt="AKANS Logo">
  </div>

  <div class="ac-profile-card">
    <div class="ac-avatar" id="acAvatar">A</div>
    <h3 id="acName">—</h3>
    <p id="acEmail">—</p>
  </div>

  <div class="ac-card ac-balance-card">
    <div>
      <p class="ac-label">Wallet Balance</p>
      <div class="ac-balance" id="acBalance">₹0</div>
    </div>
    <button type="button" class="ac-addmoney-btn" onclick="location.href='addmoney.html'">+ Add Money</button>
  </div>

  <div class="ac-card">
    <button type="button" class="ac-menu-item" onclick="location.href='myorder.html'">
      <span>📦 My Orders</span><span class="ac-arrow">→</span>
    </button>
    <button type="button" class="ac-menu-item" onclick="location.href='addmoney.html'">
      <span>➕ Add Money</span><span class="ac-arrow">→</span>
    </button>
  </div>

  <div class="ac-card" id="acWhatsappCard" style="display:none">
    <p class="ac-label">WhatsApp Number</p>
    <p class="ac-whatsapp-value" id="acWhatsapp">—</p>
  </div>

  <button type="button" class="ac-logout-btn" id="acLogoutBtn">🚪 Logout</button>

  <div class="trust-card">
    <div class="trust-grid">
      <div class="trust-item">✅ Safe Payment</div>
      <div class="trust-item">⚡ Fast Approval</div>
      <div class="trust-item">🔒 Secure System</div>
      <div class="trust-item">💬 24/7 Support</div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item" data-page="index.html" onclick="location.href='index.html'">
    
    <span>Bundles</span>
  </button>
  <button class="nav-item" data-page="ff.html" onclick="location.href='ff.html'">
    
    <span>Free Fire</span>
  </button>
  <button class="nav-item" data-page="other.html" onclick="location.href='other.html'">
    
    <span>Other</span>
  </button>
  <button class="nav-item" data-page="account.html" onclick="location.href='account.html'">
   
    <span>Account</span>
  </button>
</nav>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const currentPage = window.location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".nav-item").forEach(btn => {
    if (btn.dataset.page === currentPage) btn.classList.add("active");
  });

  let lastScroll = 0;
  const nav = document.querySelector(".bottom-nav");
  if (nav) {
    window.addEventListener("scroll", () => {
      const cur = window.pageYOffset;
      nav.classList.toggle("hide", cur > lastScroll && cur > 80);
      lastScroll = cur;
    });
  }
});
</script>
<script type="module" src="js/account.js"></script>
</body>
</html>
